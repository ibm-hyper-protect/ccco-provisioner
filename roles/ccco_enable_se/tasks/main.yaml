---
# Role: ccco_enable_se
# Purpose: Apply MachineConfig prot_virt=1 kernel argument to master nodes
#          (always) and worker-only nodes (when present). Wait for MCP rollout
#          to complete, then verify SE is active on each node via prot_virt_host.
#
# Steps:
#   1. Get master + worker-only node counts via kubernetes.core.k8s_info
#   2. Apply MachineConfig for master (kubernetes.core.k8s + template)
#   3. Apply MachineConfig for worker (only when worker_node_count > 0)
#   4. Wait for master MCP Updated=True, Updating=False, Degraded=False (30×60s)
#      Wait for worker MCP same conditions — only when worker_node_count > 0
#   5. Verify SE label feature.node.kubernetes.io/cpu-security.se.enabled=true on nodes

- name: Ensure kubernetes Python library is installed on bastion
  ansible.builtin.pip:
    name: kubernetes
    state: present
    executable: pip3

- name: Enable IBM Secure Execution (SE) via MachineConfig
  block:

    # -----------------------------------------------------------------------
    # Step 1: Get node counts via kubernetes.core.k8s_info
    # -----------------------------------------------------------------------
    - name: Get all nodes info
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        api_version: v1
        kind: Node
      register: all_nodes_info

    - name: Set worker_node_count fact (worker role but NOT master)
      # rejectattr/selectattr with bracket-notation keys ('metadata.labels["x/y"]')
      # is unreliable when keys contain '/' or '.'. Use a Jinja2 for-loop instead.
      # On compact clusters all nodes carry both master+worker labels — the for-loop
      # correctly excludes them, giving worker_node_count=0.
      ansible.builtin.set_fact:
        worker_node_count: >-
          {%- set result = [] -%}
          {%- for node in all_nodes_info.resources -%}
            {%- set labels = node.metadata.labels | default({}) -%}
            {%- if 'node-role.kubernetes.io/worker' in labels and
                   'node-role.kubernetes.io/master' not in labels and
                   'node-role.kubernetes.io/control-plane' not in labels -%}
              {%- set _ = result.append(node.metadata.name) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result | length }}

    - name: Display node counts
      ansible.builtin.debug:
        msg:
          - "Total nodes       : {{ all_nodes_info.resources | length }}"
          - "Worker-only nodes : {{ worker_node_count }}"

    # -----------------------------------------------------------------------
    # Step 2: Apply MachineConfig for master nodes
    # -----------------------------------------------------------------------
    - name: Apply MachineConfig for master nodes
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        state: present
        template: 99-enable-secure-execution.yaml.j2
      vars:
        mc_role: master

    # -----------------------------------------------------------------------
    # Step 3: Apply MachineConfig for worker nodes (if any)
    # -----------------------------------------------------------------------
    - name: Apply MachineConfig for worker nodes
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        state: present
        template: 99-enable-secure-execution.yaml.j2
      vars:
        mc_role: worker
      when: worker_node_count | int > 0

    # -----------------------------------------------------------------------
    # Step 4: Wait for MCP rollout via kubernetes.core.k8s_info
    #   Pause 90s to let MCO flip MCP to Updating=True before polling starts.
    #   Budget: 30 retries × 60s = 30 minutes per MCP.
    # -----------------------------------------------------------------------
    - name: Pause 90s for master MCP reconciler to start
      ansible.builtin.pause:
        seconds: 90

    - name: Wait for master MachineConfigPool rollout to complete
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        api_version: machineconfiguration.openshift.io/v1
        kind: MachineConfigPool
        name: master
      register: mcp_master_info
      until: >-
        (mcp_master_info.resources | length > 0) and
        (mcp_master_info.resources[0].status.conditions |
          selectattr('type', 'equalto', 'Updated') |
          selectattr('status', 'equalto', 'True') | list | length > 0) and
        (mcp_master_info.resources[0].status.conditions |
          selectattr('type', 'equalto', 'Updating') |
          selectattr('status', 'equalto', 'False') | list | length > 0) and
        (mcp_master_info.resources[0].status.conditions |
          selectattr('type', 'equalto', 'Degraded') |
          selectattr('status', 'equalto', 'False') | list | length > 0)
      retries: 30
      delay: 60

    - name: Display master MCP rollout status
      ansible.builtin.debug:
        msg: "Master MCP rollout complete — Updated=True, Updating=False, Degraded=False"

    - name: Pause 90s for worker MCP reconciler to start
      ansible.builtin.pause:
        seconds: 90
      when: worker_node_count | int > 0

    - name: Wait for worker MachineConfigPool rollout to complete
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        api_version: machineconfiguration.openshift.io/v1
        kind: MachineConfigPool
        name: worker
      register: mcp_worker_info
      until: >-
        (mcp_worker_info.resources | length > 0) and
        (mcp_worker_info.resources[0].status.conditions |
          selectattr('type', 'equalto', 'Updated') |
          selectattr('status', 'equalto', 'True') | list | length > 0) and
        (mcp_worker_info.resources[0].status.conditions |
          selectattr('type', 'equalto', 'Updating') |
          selectattr('status', 'equalto', 'False') | list | length > 0) and
        (mcp_worker_info.resources[0].status.conditions |
          selectattr('type', 'equalto', 'Degraded') |
          selectattr('status', 'equalto', 'False') | list | length > 0)
      retries: 30
      delay: 60
      when: worker_node_count | int > 0

    - name: Display worker MCP rollout status
      ansible.builtin.debug:
        msg: "Worker MCP rollout complete — Updated=True, Updating=False, Degraded=False"
        verbosity: 1
      when: worker_node_count | int > 0

    # -----------------------------------------------------------------------
    # Step 5: Verify SE is enabled — check NFD label on each node
    #         feature.node.kubernetes.io/cpu-security.se.enabled=true
    #         (requires NFD + IBM SE NodeFeatureRule to be applied)
    # -----------------------------------------------------------------------
    - name: Get all nodes to verify SE label
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        api_version: v1
        kind: Node
      register: se_nodes_info

    - name: Report SE label per node
      ansible.builtin.debug:
        msg: >-
          {%- set result = [] -%}
          {%- for node in se_nodes_info.resources -%}
            {%- set labels = node.metadata.labels | default({}) -%}
            {%- set se = labels.get('ibm.feature.node.kubernetes.io/se', 'absent') -%}
            {%- set _ = result.append(node.metadata.name ~ '  ibm.feature.node.kubernetes.io/se=' ~ se) -%}
          {%- endfor -%}
          {{ result }}
        verbosity: 1

    - name: Display SE enablement complete
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "IBM Secure Execution enabled successfully"
          - "Total nodes       : {{ all_nodes_info.resources | length }}"
          - "Worker-only nodes : {{ worker_node_count }}"
          - "prot_virt=1 kernel arg applied via MachineConfig"
          - "=========================================="
