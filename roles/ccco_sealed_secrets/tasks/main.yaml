---
# Role: ccco_sealed_secrets
# Purpose: Create sealed secrets and apply them to the cluster
#   - spoiler      : sealed workload secret (for CC contract) — CDH unseals via volume mount
#   - sealed-paynow : sealed TLS cert/key — CDH unseals env vars using verificationKey/decryptionKey
#                     from the contract (same mechanism works for kata-cc baremetal)
# Reference: paynowautomation.sh lines 159-160

- name: Generate sealed secret string (workload secret)
  no_log: true
  ansible.builtin.shell:
    cmd: |
      cd {{ scripts_dir }}
      ./{{ artifact_sealed_client }} \
        --secret cccosecret \
        --encryption-key encryption-key.pub \
        --signing-key signing-key.pem \
        --workload-secret "{{ contract.workload_secret }}" > sealed_secret.txt
    executable: /bin/bash
  register: seal_secret_result

- name: Read sealed secret
  ansible.builtin.slurp:
    src: "{{ scripts_dir }}/sealed_secret.txt"
  register: sealed_secret_content

- name: Create sealed secret manifest
  ansible.builtin.template:
    src: sealed-secret-spoiler.yaml.j2
    dest: "{{ scripts_dir }}/sealed-secret-spoiler.yaml"
    mode: '0644'

- name: Apply spoiler sealed secret to cluster
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
    state: present
    src: "{{ scripts_dir }}/sealed-secret-spoiler.yaml"

# --- Seal TLS cert and key for PayNow application ---
# Matching reference paynowautomation.sh lines 159-160:
#   --secret $CERT  = base64-w0 of PEM used as the secret identifier
#   --workload-secret "$CERT" = the actual value being sealed
# CDH unseals using verificationKey + decryptionKey from the contract.

- name: Seal TLS certificate
  no_log: true
  ansible.builtin.shell:
    cmd: |
      cd {{ scripts_dir }}
      export CERT=$(base64 -w0 common_app_cert.pem)
      ./{{ artifact_sealed_client }} \
        --secret "$CERT" \
        --encryption-key encryption-key.pub \
        --signing-key signing-key.pem \
        --workload-secret "$CERT" > sealed_cert.txt
    executable: /bin/bash

- name: Seal TLS key
  no_log: true
  ansible.builtin.shell:
    cmd: |
      cd {{ scripts_dir }}
      export KEY=$(base64 -w0 common_app_key.pem)
      ./{{ artifact_sealed_client }} \
        --secret "$KEY" \
        --encryption-key encryption-key.pub \
        --signing-key signing-key.pem \
        --workload-secret "$KEY" > sealed_key.txt
    executable: /bin/bash

- name: Read sealed certificate
  no_log: true
  ansible.builtin.slurp:
    src: "{{ scripts_dir }}/sealed_cert.txt"
  register: sealed_cert_content

- name: Read sealed key
  no_log: true
  ansible.builtin.slurp:
    src: "{{ scripts_dir }}/sealed_key.txt"
  register: sealed_key_content

- name: Delete existing sealed-paynow secret if present
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
    state: absent
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: sealed-paynow
        namespace: "{{ ccco_namespace }}"

- name: Create sealed-paynow secret with sealed cert and key
  no_log: true
  kubernetes.core.k8s:
    kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: sealed-paynow
        namespace: "{{ ccco_namespace }}"
      type: Opaque
      stringData:
        CERT: "{{ sealed_cert_content.content | b64decode | trim }}"
        KEY: "{{ sealed_key_content.content | b64decode | trim }}"

- name: Extract verification and decryption keys
  ansible.builtin.shell:
    cmd: |
      cd {{ scripts_dir }}
      cat verification-key.pub | awk '{printf "%s\\n", $0}' | sed '$ s/\\n$//' > secret_verification_key.txt
      cat decryption-key.pem | awk '{printf "%s\\n", $0}' | sed '$ s/\\n$//' > secret_decryption_key.txt
    executable: /bin/bash

- name: Display secret status
  ansible.builtin.debug:
    msg:
      - "Sealed secret 'spoiler' created in namespace {{ ccco_namespace }}"
      - "Sealed secret 'sealed-paynow' (CERT + KEY) created in namespace {{ ccco_namespace }}"
