---
# Role: ccco_install_nfd
# Purpose: Install the Node Feature Discovery (NFD) Operator on OpenShift,
#          create the NodeFeatureDiscovery CR to start node labelling, and
#          apply the IBM Secure Execution NodeFeatureRule so all nodes are
#          labelled with ibm.feature.node.kubernetes.io/se=true.
#
# Prerequisite for: ccco_install_kata
#   The KataConfig reconciler (OSC operator) requires ibm.feature.node.kubernetes.io/se
#   to be present on all nodes before it can detect the IBM SE TEE platform.
#   This role waits and asserts that label before completing (Step 9).
#
# Steps:
#   1. Create openshift-nfd Namespace
#   2. Create OperatorGroup
#   3. Create Subscription (catalog source configurable via nfd_source)
#   4. Wait for CSV to reach Succeeded
#   5. Create NodeFeatureDiscovery CR
#   6. Apply IBM SE NodeFeatureRule CR (sets ibm.feature.node.kubernetes.io/se=true)
#   7. Wait for NFD worker + master pods to be Running
#   8. Verify generic node labels are populated
#   9. Wait for ibm.feature.node.kubernetes.io/se=true on all nodes + assert
#  10. Report IBM SE label per node

- name: Ensure kubernetes Python library is installed on bastion
  ansible.builtin.pip:
    name: kubernetes
    state: present
    executable: pip3

- name: Install Node Feature Discovery (NFD) Operator
  block:

    # -----------------------------------------------------------------------
    # Step 1: Create Namespace
    # -----------------------------------------------------------------------
    - name: Create openshift-nfd namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        state: present
        template: nfd-namespace.yaml.j2

    # -----------------------------------------------------------------------
    # Step 2: Create OperatorGroup
    # -----------------------------------------------------------------------
    - name: Create NFD OperatorGroup
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        state: present
        template: nfd-operatorgroup.yaml.j2

    # -----------------------------------------------------------------------
    # Step 3: Create Subscription
    # -----------------------------------------------------------------------
    - name: Create NFD Subscription
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        state: present
        template: nfd-subscription.yaml.j2

    # -----------------------------------------------------------------------
    # Step 4: Wait for CSV to reach Succeeded
    # -----------------------------------------------------------------------
    - name: Wait for NFD CSV to reach Succeeded phase
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: openshift-nfd
      register: nfd_csv_list
      until: >-
        nfd_csv_list.resources | length > 0 and
        (nfd_csv_list.resources | selectattr('status.phase', 'defined') |
         selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0)
      retries: 30
      delay: 20

    # Display the CSV that actually reached Succeeded — not blindly resources[0]
    - name: Display NFD CSV status
      ansible.builtin.debug:
        msg: >-
          {{
            nfd_csv_list.resources |
            selectattr('status.phase', 'defined') |
            selectattr('status.phase', 'equalto', 'Succeeded') |
            map(attribute='metadata.name') | list
          }} reached Succeeded

    # -----------------------------------------------------------------------
    # Step 5: Create NodeFeatureDiscovery CR
    # -----------------------------------------------------------------------
    - name: Create NodeFeatureDiscovery CR
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        state: present
        template: nfd-instance.yaml.j2

    # -----------------------------------------------------------------------
    # Step 6: Apply IBM SE NodeFeatureRule CR
    # -----------------------------------------------------------------------
    - name: Apply IBM SE NodeFeatureRule CR
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        state: present
        template: nfd-se-rule.yaml.j2

    # -----------------------------------------------------------------------
    # Step 7: Wait for NFD worker + master pods to be Running
    # Scoped to pods with app=nfd label to avoid fragility from transient
    # install/completed pods that may also appear in openshift-nfd.
    # -----------------------------------------------------------------------
    - name: Wait for NFD worker and master pods to be Running
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        kind: Pod
        namespace: openshift-nfd
        label_selectors:
          - "app in (nfd-master, nfd-worker)"
      register: nfd_pods
      until: >-
        nfd_pods.resources | length > 0 and
        (nfd_pods.resources |
         rejectattr('status.phase', 'equalto', 'Running') |
         rejectattr('status.phase', 'equalto', 'Succeeded') | list | length == 0)
      retries: 18
      delay: 10

    - name: Display NFD pod statuses
      ansible.builtin.debug:
        msg: >-
          {{ nfd_pods.resources | map(attribute='metadata.name') | list |
             zip(nfd_pods.resources | map(attribute='status.phase') | list) |
             map('join', ' → ') | list }}

    # -----------------------------------------------------------------------
    # Step 8: Verify generic NFD node labels are populated
    # -----------------------------------------------------------------------
    - name: Wait for NFD node labels to be present
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        kind: Node
      register: nfd_nodes
      until: >-
        (nfd_nodes.resources |
         map(attribute='metadata.labels') |
         map('dict2items') | flatten |
         selectattr('key', 'match', '^feature\\.node\\.kubernetes\\.io') |
         list | length) > 0
      retries: 10
      delay: 30

    # -----------------------------------------------------------------------
    # Step 9: Wait for ibm.feature.node.kubernetes.io/se label on ALL nodes
    #         The OSC operator (KataConfig reconciler) REQUIRES this label to
    #         detect the IBM SE TEE platform. Must be present before ccco_install_kata.
    #         Targets all nodes (not just masters) so non-compact clusters with
    #         dedicated workers are also covered.
    #         Strategy: fetch total node count once, then poll labelled nodes
    #         until counts match — single integer comparison per retry.
    #         Budget: 20 retries × 30s = 10 minutes
    # -----------------------------------------------------------------------
    - name: Get total node count
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        api_version: v1
        kind: Node
      register: all_nodes_se

    - name: Wait for ibm.feature.node.kubernetes.io/se=true on all nodes
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        api_version: v1
        kind: Node
        label_selectors:
          - "ibm.feature.node.kubernetes.io/se=true"
      register: se_labelled_nodes
      until: se_labelled_nodes.resources | length == all_nodes_se.resources | length
      retries: 20
      delay: 30

    - name: Assert ibm.feature.node.kubernetes.io/se=true present on all nodes
      ansible.builtin.assert:
        that:
          - se_labelled_nodes.resources | length == all_nodes_se.resources | length
        fail_msg: >-
          ibm.feature.node.kubernetes.io/se=true not present on all nodes
          ({{ se_labelled_nodes.resources | length }}/{{ all_nodes_se.resources | length }} labelled).
          KataConfig will fail to detect TEE platform without this label.
          Check that ccco_enable_se ran successfully and the NodeFeatureRule ibm-se-rule was applied.
        success_msg: >-
          ibm.feature.node.kubernetes.io/se=true present on all
          {{ all_nodes_se.resources | length }} nodes — OK

    # -----------------------------------------------------------------------
    # Step 10: Report IBM SE label per node
    # -----------------------------------------------------------------------
    - name: Report SE label per node
      ansible.builtin.debug:
        msg: >-
          {{ se_labelled_nodes.resources | map(attribute='metadata.name') |
             map('regex_replace', '$', '  ibm.feature.node.kubernetes.io/se=true') | list }}

    - name: Display NFD installation complete
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "NFD Operator installed successfully"
          - "Namespace : openshift-nfd"
          - "Source    : {{ nfd_source }}"
          - "ibm SE label verified on all nodes"
          - "=========================================="
