---
# Role: ccco_remove_workload
# Purpose: Dynamically discover and remove all Pods running with runtimeClassName kata-cc
#          across the cluster, clean up sample workload services/secrets, and delete
#          generated artifact files from the bastion.
#
# Cluster objects removed:
#   - Pods    all pods with runtimeClassName: kata-cc across all namespaces
#   - Service paynow-ssl      in {{ ccco_namespace }}
#   - Secret  spoiler         in {{ ccco_namespace }}
#   - Secret  sealed-paynow   in {{ ccco_namespace }}
#
# Generated files wiped from {{ scripts_dir }} on bastion:
#   contract artefacts, keys, sealed tokens, manifests, copied artifacts
#
# All steps are idempotent — safe to run when nothing is deployed.

- name: Ensure kubernetes Python library is installed on bastion
  ansible.builtin.pip:
    name: kubernetes
    state: present
    executable: pip3

- name: Remove workload and generated files
  block:

    # -----------------------------------------------------------------------
    # Step 1: Discover and delete all Pods using kata-cc runtime class
    # -----------------------------------------------------------------------
    - name: Get all Pods across cluster
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        api_version: v1
        kind: Pod
      register: all_cluster_pods

    - name: Filter pods with runtimeClassName kata-cc
      ansible.builtin.set_fact:
        kata_cc_pods: >-
          {%- set result = [] -%}
          {%- for pod in all_cluster_pods.resources | default([]) -%}
            {%- if pod.spec.runtimeClassName | default('') == 'kata-cc' -%}
              {%- set _ = result.append({'name': pod.metadata.name, 'namespace': pod.metadata.namespace}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result }}

    - name: Display discovered kata-cc pods
      ansible.builtin.debug:
        msg: >-
          {{ 'Found ' ~ (kata_cc_pods | length) ~ ' kata-cc pod(s): ' ~ (kata_cc_pods | map(attribute='name') | list | join(', '))
             if (kata_cc_pods | length > 0) else 'No pods found running with runtimeClassName kata-cc' }}
        verbosity: 1

    - name: Delete kata-cc Pods
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        api_version: v1
        kind: Pod
        name: "{{ item.name }}"
        namespace: "{{ item.namespace }}"
        state: absent
      loop: "{{ kata_cc_pods }}"
      when: kata_cc_pods | length > 0

    - name: Wait for kata-cc Pods to be fully deleted
      kubernetes.core.k8s_info:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        api_version: v1
        kind: Pod
        name: "{{ item.name }}"
        namespace: "{{ item.namespace }}"
      register: kata_pod_check
      until: kata_pod_check is succeeded and kata_pod_check.resources | length == 0
      retries: 18
      delay: 10
      loop: "{{ kata_cc_pods }}"
      when: kata_cc_pods | length > 0

    # -----------------------------------------------------------------------
    # Step 2: Delete PayNow Service
    # -----------------------------------------------------------------------
    - name: Delete paynow-ssl Service
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        api_version: v1
        kind: Service
        name: paynow-ssl
        namespace: "{{ ccco_namespace }}"
        state: absent

    # -----------------------------------------------------------------------
    # Step 3: Delete Secrets
    # -----------------------------------------------------------------------
    - name: Delete spoiler Secret
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        api_version: v1
        kind: Secret
        name: spoiler
        namespace: "{{ ccco_namespace }}"
        state: absent

    - name: Delete sealed-paynow Secret
      kubernetes.core.k8s:
        kubeconfig: "{{ cluster.auth_dir_path }}/kubeconfig"
        api_version: v1
        kind: Secret
        name: sealed-paynow
        namespace: "{{ ccco_namespace }}"
        state: absent

    - name: Display cluster object removal complete
      ansible.builtin.debug:
        msg:
          - "Cluster objects removed:"
          - "  kata-cc Pods ({{ kata_cc_pods | length }}) : {{ kata_cc_pods | map(attribute='name') | list | join(', ') if (kata_cc_pods | length > 0) else 'none' }}"
          - "  Service paynow-ssl ({{ ccco_namespace }}) : deleted"
          - "  Secret  spoiler ({{ ccco_namespace }})    : deleted"
          - "  Secret  sealed-paynow ({{ ccco_namespace }}): deleted"
        verbosity: 1

    # -----------------------------------------------------------------------
    # Step 4: Remove the entire scripts_dir directory from bastion
    # Deletes the directory and all contents in one shot — cleaner than
    # listing individual files and handles any unexpected leftovers.
    # -----------------------------------------------------------------------
    - name: Remove scripts_dir directory entirely
      ansible.builtin.file:
        path: "{{ scripts_dir }}"
        state: absent

    - name: Display removal complete
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Workload and generated files removed"
          - "kata-cc Pods deleted : {{ kata_cc_pods | length }}"
          - "scripts_dir          : {{ scripts_dir }} — deleted"
          - "=========================================="
