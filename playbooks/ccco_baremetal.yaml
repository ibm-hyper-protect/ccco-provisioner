---
# Usage: ansible-playbook playbooks/ccco_baremetal.yaml
# Hosts file is auto-generated from all.yaml — no manual creation needed.
#
# Pre-requisites (place in artifacts/ directory before running):
#   - HKD*.crt                                   : Host Key Document certificate
#   - <contract_encryption_key>                  : IBM CCCO contract encryption certificate (.crt)
#   - <se_header>                                : SE header binary (.bin)
#   - ibm-ccco-sealed-secret-creator-client-*    : Sealed secret client binary
#   - common_app_cert.pem                        : PayNow TLS certificate
#   - common_app_key.pem                         : PayNow TLS key

- name: Generate inventory hosts file from all.yaml
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/default/group_vars/all.yaml"
  tasks:
    - name: Set inventory
      ansible.builtin.import_role:
        name: ccco_setinventory

- name: Generate CCCO contract and deploy PayNow workload
  hosts: bastion
  gather_facts: false
  vars:
    scripts_dir: "/root/ccco-artifacts"
    ccco_namespace: "default"
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
  tasks:
    - name: Display deployment start
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "CCCO Baremetal PayNow Deployment"
          - "=========================================="
          - "Host      : {{ inventory_hostname }}"
          - "Namespace : {{ ccco_namespace }}"
          - "Artifacts : {{ scripts_dir }}"
          - "=========================================="

    - name: Enable IBM Secure Execution (SE) on cluster nodes
      ansible.builtin.import_role:
        name: ccco_enable_se

    - name: Install Node Feature Discovery (NFD) Operator
      ansible.builtin.import_role:
        name: ccco_install_nfd

    - name: Install OpenShift Sandboxed Containers (OSC) Operator
      ansible.builtin.import_role:
        name: ccco_install_osc

    - name: Create KataConfig and install Kata runtime
      ansible.builtin.import_role:
        name: ccco_install_kata

    - name: Generate CCCO contract keys and policy
      ansible.builtin.import_role:
        name: ccco_contract_generator

    - name: Create and apply sealed secret
      ansible.builtin.import_role:
        name: ccco_sealed_secrets

    - name: Build contract and generate PayNow manifest
      ansible.builtin.import_role:
        name: ccco_paynow_deploy
