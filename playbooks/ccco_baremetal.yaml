---
# Usage: ansible-playbook playbooks/ccco_baremetal.yaml
# Purpose: Full end-to-end deployment — cluster install + PayNow + Busybox workloads.
#          For subsequent paynow-only re-deploys use:  playbooks/ccco_paynow_workload.yaml
#          For subsequent busybox-only re-deploys use: playbooks/ccco_busybox_deploy.yaml
#          For cluster-only re-install use:             playbooks/ccco_install_cluster.yaml
#
# Pre-requisites (place in artifacts/ directory before running):
#   - HKD*.crt                                   : Host Key Document certificate
#   - <contract_encryption_key>                  : IBM CCCO contract encryption certificate (.crt)
#   - <se_header>                                : SE header binary (.bin)
#   - ibm-ccco-sealed-secret-creator-client-*    : Sealed secret client binary
#   - common_app_cert.pem                        : PayNow TLS certificate
#   - common_app_key.pem                         : PayNow TLS key

- name: Generate inventory hosts file from all.yaml
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/default/group_vars/all.yaml"
  tasks:
    - name: Set inventory
      ansible.builtin.import_role:
        name: ccco_setinventory

- name: Install CCCO cluster components
  ansible.builtin.import_playbook: ccco_install_cluster.yaml

- name: Deploy PayNow workload
  ansible.builtin.import_playbook: ccco_paynow_workload.yaml

- name: Deploy Busybox workload
  ansible.builtin.import_playbook: ccco_busybox_deploy.yaml
