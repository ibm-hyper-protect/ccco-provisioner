---
# Usage: ansible-playbook playbooks/ccco_remove_image_config.yaml
# Purpose: Remove the pull secret and cluster-wide registry credentials added by
#          ccco_configure_image. Run with the SAME all.yaml values that were used
#          during configure — the annotation key must match or the entry is left untouched.
#
# Use this playbook when:
#   - you want to rotate or remove the registry credential without a full cluster cleanup
#   - you need to change imagepull.registry_name or imagepull.target_namespace:
#       1. run this playbook with the OLD all.yaml values
#       2. update all.yaml to the new values
#       3. run ccco_configure_image.yaml

- name: Generate inventory hosts file from all.yaml
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/default/group_vars/all.yaml"
  tasks:
    - name: Set inventory
      ansible.builtin.import_role:
        name: ccco_setinventory

- name: Remove CCCO image pull configuration
  hosts: bastion
  gather_facts: false
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
  tasks:
    - name: Remove image pull secret and cluster-wide registry entry
      ansible.builtin.import_role:
        name: ccco_remove_image_config
