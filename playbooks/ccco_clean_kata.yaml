---
# Usage: ansible-playbook playbooks/ccco_clean_kata.yaml
# Idempotent removal of KataConfig CR and the Kata runtime.
# Waits for MCP rollout and verifies kata-cc RuntimeClass is gone.

- name: Generate inventory hosts file from all.yaml
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/default/group_vars/all.yaml"
  tasks:
    - name: Set inventory
      ansible.builtin.import_role:
        name: ccco_setinventory

- name: Remove KataConfig and Kata runtime
  hosts: bastion
  gather_facts: false
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
  tasks:
    - name: Remove KataConfig
      ansible.builtin.import_role:
        name: ccco_remove_kata
