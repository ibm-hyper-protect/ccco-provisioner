---
# Usage: ansible-playbook playbooks/ccco_enable_se.yaml
# Applies prot_virt=1 MachineConfig to master (and worker) nodes,
# waits for MCP rollout, and verifies SE is active on each node.

- name: Generate inventory hosts file from all.yaml
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/default/group_vars/all.yaml"
  tasks:
    - name: Set inventory
      ansible.builtin.import_role:
        name: ccco_setinventory

- name: Enable IBM Secure Execution (SE) on cluster nodes
  hosts: bastion
  gather_facts: false
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
  tasks:
    - name: Enable SE via MachineConfig
      ansible.builtin.import_role:
        name: ccco_enable_se
