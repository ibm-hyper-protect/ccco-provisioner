---
# Usage: ansible-playbook playbooks/ccco_install_osc.yaml
# Installs the OpenShift Sandboxed Containers (OSC) Operator standalone.

- name: Generate inventory hosts file from all.yaml
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/default/group_vars/all.yaml"
  tasks:
    - name: Set inventory
      ansible.builtin.import_role:
        name: ccco_setinventory

- name: Install OpenShift Sandboxed Containers (OSC) Operator
  hosts: bastion
  gather_facts: false
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
  tasks:
    - name: Install OSC Operator
      ansible.builtin.import_role:
        name: ccco_install_osc
