---
# Usage: ansible-playbook playbooks/ccco_configure_image.yaml
# Purpose: Configure the cluster to pull the CCCO image from your registry
#          (pull secret + cluster-wide pull-secret). Requires the OSC operator
#          to be installed. Run ccco_push_image.yaml first if the image is still
#          a bundle; otherwise just set kata.addon_image and the imagepull credentials.

- name: Generate inventory hosts file from all.yaml
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/default/group_vars/all.yaml"
  tasks:
    - name: Set inventory
      ansible.builtin.import_role:
        name: ccco_setinventory

- name: Configure cluster to pull the CCCO image
  hosts: bastion
  gather_facts: false
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
  tasks:
    - name: Configure image pull
      ansible.builtin.import_role:
        name: ccco_configure_image
