---
# Usage: ansible-playbook playbooks/ccco_install_cluster.yaml
# Purpose: One-time cluster setup — SE, NFD, OSC, KataConfig.
#          Run this once per cluster before deploying any workload.
#
# Pre-requisites (place in artifacts/ directory before running):
#   - HKD*.crt                                   : Host Key Document certificate
#   - <contract_encryption_key>                  : IBM CCCO contract encryption certificate (.crt)
#   - <se_header>                                : SE header binary (.bin)
#   - ibm-ccco-sealed-secret-creator-client-*    : Sealed secret client binary

- name: Generate inventory hosts file from all.yaml
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/default/group_vars/all.yaml"
  tasks:
    - name: Set inventory
      ansible.builtin.import_role:
        name: ccco_setinventory

- name: Install CCCO cluster components
  hosts: bastion
  gather_facts: false
  vars:
    scripts_dir: "/root/ccco-artifacts"
    ccco_namespace: "default"
  vars_files:
    - "{{ inventory_dir }}/group_vars/all.yaml"
  tasks:
    - name: Display deployment start
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "CCCO Cluster Installation"
          - "=========================================="
          - "Host      : {{ inventory_hostname }}"
          - "Namespace : {{ ccco_namespace }}"
          - "=========================================="

    - name: Enable IBM Secure Execution (SE) on cluster nodes
      ansible.builtin.import_role:
        name: ccco_enable_se

    - name: Install Node Feature Discovery (NFD) Operator
      ansible.builtin.import_role:
        name: ccco_install_nfd

    - name: Install OpenShift Sandboxed Containers (OSC) Operator
      ansible.builtin.import_role:
        name: ccco_install_osc

    # TEMPORARILY DISABLED: image push and image pull configuration.
    # With these off, set kata.addon_image in all.yaml (ccco_install_kata requires it).
    # To re-enable, uncomment both tasks below.
    #
    # # Optional: only runs when the IBM fixpack bundle (a *.tar.gz) is in artifacts/
    # # AND imagepull.registry_name is set in all.yaml. Without the imagepull section the push
    # # is skipped, so a bundle left in artifacts/ does not break a run that sets kata.addon_image.
    # # Sets resolved_addon_image, which ccco_install_kata then uses.
    # - name: Push CCCO image to registry
    #   ansible.builtin.include_role:
    #     name: ccco_push_image
    #   vars:
    #     ccco_push_image_standalone: false
    #   when:
    #     - imagepull is defined and imagepull.registry_name | default('', true) | trim != ''
    #     - lookup('ansible.builtin.fileglob', playbook_dir ~ '/../artifacts/*.tar.gz', wantlist=True) | length > 0
    #
    # # Optional: only runs when imagepull.registry_name is set in all.yaml.
    # - name: Configure cluster to pull the CCCO image
    #   ansible.builtin.include_role:
    #     name: ccco_configure_image
    #   when: imagepull is defined and imagepull.registry_name | default('', true) | trim != ''

    - name: Create KataConfig and install Kata runtime
      ansible.builtin.import_role:
        name: ccco_install_kata
